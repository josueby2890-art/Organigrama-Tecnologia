<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Organigrama · Área de Tecnología 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f4f6fa;--surface:#fff;--border:rgba(0,0,0,0.08);
  --text:#111827;--muted:#6b7280;
  --orange:#e07b00;--green:#3ec87a;--blue:#2eb8e6;--lime:#8dc63f;--navy:#2c3e6b;
  --purple:#9b59d0;
  --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)!important;font-family:var(--fb);font-size:14px;line-height:1.6;color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(rgba(0,0,0,0.04) 1px,transparent 1px);background-size:26px 26px;pointer-events:none;z-index:0}

.scprog{position:fixed;top:0;left:0;height:3px;z-index:300;width:0%;background:linear-gradient(90deg,var(--orange),var(--green),var(--blue),var(--lime));transition:width .1s linear}

.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:28px 18px 80px}

/* ── HEADER ── */
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:32px;padding-bottom:20px;border-bottom:2px solid var(--border)}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--fh);font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--orange);background:rgba(224,123,0,0.09);border:1px solid rgba(224,123,0,0.25);padding:4px 12px;border-radius:2px;margin-bottom:12px}
.badge::before{content:'';width:6px;height:6px;background:var(--orange);border-radius:50%;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
h1{font-family:var(--fh);font-size:clamp(20px,3vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-bottom:8px}
h1 em{font-style:normal;color:var(--orange)}
.sub{color:var(--muted);font-size:13px;max-width:500px}
.kpis{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.kpi{background:var(--surface);border:1px solid var(--border);box-shadow:0 1px 5px rgba(0,0,0,0.06);padding:12px 18px;border-radius:8px;display:flex;flex-direction:column;gap:1px;min-width:110px;transition:box-shadow .2s,transform .2s}
.kpi:hover{box-shadow:0 5px 14px rgba(0,0,0,0.1);transform:translateY(-3px)}
.kpi .n{font-family:var(--fh);font-size:24px;font-weight:800;line-height:1}
.kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* ── SEC LABEL ── */
.sec{font-family:var(--fh);font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;margin-bottom:24px}
.sec::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── ORG TREE ── */
.org-tree{display:flex;flex-direction:column;align-items:center}

.level-leader{display:flex;justify-content:center;width:100%;margin-bottom:0}

.trunk{width:2px;height:28px;background:linear-gradient(to bottom,var(--orange),rgba(44,62,107,0.5));margin:0 auto}

.branches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%}
.branch{display:flex;flex-direction:column;align-items:center}
.sub-vline{width:2px;height:28px;background:var(--accent,#9b59d0);opacity:.35;margin:0 auto;}
.sub-card{margin-top:0;transform:scale(0.93);transform-origin:top center;}
.vline{width:2px;height:24px;background:var(--border)}

/* ── PERSON CARD ── */
.p-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-top:3px solid var(--accent);
  border-radius:10px;
  padding:18px 14px 14px;
  cursor:pointer;
  transition:box-shadow .22s,transform .22s;
  width:100%;text-align:center;
  box-shadow:0 1px 5px rgba(0,0,0,0.06);
  user-select:none;
}
.p-card:hover{box-shadow:0 6px 20px rgba(0,0,0,0.11);transform:translateY(-3px)}
.p-card.open{box-shadow:0 6px 20px rgba(0,0,0,0.13);border-color:var(--accent)}

.level-leader .p-card{max-width:300px;padding:22px 22px 18px}

/* ── AVATAR ── */
.avatar{
  width:54px;height:54px;border-radius:50%;
  background:#e9edf5;border:2px solid var(--accent);
  margin:0 auto 12px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fh);font-size:17px;font-weight:800;
  color:var(--accent);overflow:hidden;position:relative;
  transition:box-shadow .2s;
}
.p-card:hover .avatar{box-shadow:0 0 0 4px rgba(0,0,0,0.06)}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center top;border-radius:50%;position:absolute;inset:0}
.level-leader .avatar{width:68px;height:68px;font-size:21px}

.p-name{font-family:var(--fh);font-size:11px;font-weight:700;line-height:1.3;margin-bottom:4px}
.level-leader .p-name{font-size:13px}
.p-role{font-size:10px;color:var(--muted);margin-bottom:10px;line-height:1.4}
.p-chip{
  display:inline-flex;align-items:center;
  font-family:var(--fh);font-size:9px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:#fff;background:var(--accent);
  padding:3px 9px;border-radius:2px;margin-bottom:10px;
}
.toggle-hint{
  font-size:10px;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:5px;
  font-family:var(--fh);font-weight:600;letter-spacing:.04em;transition:color .2s;
}
.p-card:hover .toggle-hint,.p-card.open .toggle-hint{color:var(--accent)}
.toggle-hint svg{width:10px;height:10px;transition:transform .3s}
.p-card.open .toggle-hint svg{transform:rotate(180deg)}

/* ── LEADER PANEL ── */
.fn-panel{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.4,0,.2,1),opacity .35s;opacity:0;width:100%}
.fn-panel.open{max-height:2000px;opacity:1}

.fn-panel-inner{
  background:var(--surface);
  border:1px solid var(--border);
  border-top:3px solid var(--p-accent,var(--orange));
  border-radius:10px;
  padding:22px 20px 20px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  max-width:660px;width:100%;
}

/* ── BRANCH PANEL ROW ── */
.panel-row{display:none;width:100%;margin-top:2px}
.panel-row.active{display:flex;justify-content:center}
.panel-row .fn-panel-inner{max-width:100%;border-radius:10px}

/* ── PANEL CONTENTS ── */
.fn-panel-title{
  font-family:var(--fh);font-size:10.5px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:10px;margin-bottom:18px;
}
.fn-panel-title::after{content:'';flex:1;height:1px;background:var(--border)}
.fn-panel-title em{font-style:normal;color:var(--p-accent,var(--orange))}

.area-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.area-block{
  background:#f4f6fa;border:1px solid var(--border);
  border-left:3px solid var(--acolor,var(--navy));
  border-radius:8px;padding:12px 14px;
}
.area-label{
  font-family:var(--fh);font-size:9.5px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--acolor,var(--navy));margin-bottom:8px;line-height:1.3;
}
.fn-list{list-style:none;display:flex;flex-direction:column;gap:4px}
.fn-list li{font-size:11.5px;color:var(--text);padding-left:14px;position:relative;line-height:1.45}
.fn-list li::before{content:'→';position:absolute;left:0;color:var(--acolor,var(--navy));font-size:10px;top:1px}
.obs-tag{margin-top:8px;font-size:10.5px;color:var(--muted);border-top:1px solid var(--border);padding-top:7px;font-style:italic}

/* ── FADE IN ── */
.fi{opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s ease}
.fi.on{opacity:1;transform:translateY(0)}
.fi:nth-child(2){transition-delay:.07s}.fi:nth-child(3){transition-delay:.14s}
.fi:nth-child(4){transition-delay:.21s}

footer{text-align:center;margin-top:50px;font-size:11px;color:var(--muted);letter-spacing:.06em;padding-top:20px;border-top:1px solid var(--border)}

@media(max-width:860px){.branches{grid-template-columns:repeat(3,1fr)}.area-grid{grid-template-columns:1fr}}

/* ══════════════════════════════════════════
   SECCIÓN: Áreas de Responsabilidad
══════════════════════════════════════════ */
.resp-section{margin-bottom:48px}
.resp-intro-text{font-size:13px;color:var(--muted);max-width:600px;margin-bottom:24px;line-height:1.7}

.resp-bento{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:auto;gap:12px}

.resp-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:22px 20px 20px;
  position:relative;
  overflow:hidden;
  cursor:default;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s;
}
.resp-card::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 110% -10%, var(--rc) 0%, transparent 60%);
  opacity:.07;pointer-events:none;
  transition:opacity .3s;
}
.resp-card:hover{transform:translateY(-4px);box-shadow:0 12px 36px rgba(0,0,0,0.09)}
.resp-card:hover::after{opacity:.13}

/* Barra superior de color */
.resp-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--rc);border-radius:16px 16px 0 0;
}

/* Cards destacadas (más grandes) */
.resp-card.wide{grid-column:span 2}
.resp-card.tall{grid-row:span 2}

/* Número grande decorativo */
.resp-num{
  position:absolute;top:14px;right:18px;
  font-family:var(--fh);font-size:52px;font-weight:800;
  color:var(--rc);opacity:.08;line-height:1;pointer-events:none;
}

/* Ícono SVG */
.resp-icon{
  width:38px;height:38px;border-radius:10px;
  background:color-mix(in srgb, var(--rc) 12%, transparent);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:14px;flex-shrink:0;
}
.resp-icon svg{width:18px;height:18px;stroke:var(--rc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.resp-area-num{
  font-family:var(--fh);font-size:10px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--rc);margin-bottom:6px;opacity:.8;
}
.resp-title{
  font-family:var(--fh);font-size:13.5px;font-weight:700;
  color:var(--text);line-height:1.3;margin-bottom:10px;
}
.resp-desc{
  font-size:11.5px;color:var(--muted);line-height:1.6;margin-bottom:12px;
}
.resp-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.resp-tag{
  font-size:10px;font-family:var(--fb);font-weight:500;
  color:var(--rc);
  background:color-mix(in srgb, var(--rc) 10%, transparent);
  border:1px solid color-mix(in srgb, var(--rc) 20%, transparent);
  border-radius:20px;padding:2px 9px;
}

@media(max-width:960px){.resp-bento{grid-template-columns:repeat(2,1fr)}.resp-card.wide{grid-column:span 1}}
@media(max-width:520px){.resp-bento{grid-template-columns:1fr}.resp-card.tall{grid-row:span 1}}


@media(max-width:520px){.branches{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

    {area:0,obs:'Dirección y gobierno.',fns:['Definir la visión tecnológica del área alineada a los objetivos del negocio.','Priorizar iniciativas tecnológicas según impacto, costo y urgencia.','Presentar a dirección propuestas de inversión y evolución tecnológica.','Evaluar el avance estratégico del área mediante indicadores y resultados.']},
    {area:1,obs:'Dirección y gobierno.',fns:['Impulsar proyectos de transformación digital con visión transversal.','Coordinar con otras áreas la adopción de soluciones tecnológicas.','Patrocinar iniciativas de mejora digital orientadas al negocio.','Resolver prioridades y conflictos interáreas en proyectos de transformación.']},
    {area:2,obs:'Dirección y gobierno.',fns:['Definir lineamientos para el uso de automatización e IA en la organización.','Priorizar proyectos de RPA e IA según impacto operativo.','Aprobar iniciativas de automatización con valor estratégico.','Medir beneficios pre/post automatización e inteligencia artificial.']},
    {area:3,obs:'Dirección y gobierno.',fns:['Aprobar prioridades de inversión en infraestructura tecnológica.','Definir criterios de continuidad operativa y disponibilidad de servicios.','Supervisar riesgos críticos de infraestructura y planes de mitigación.','Evaluar capacidad tecnológica para soportar el crecimiento del negocio.']},
    {area:4,obs:'Dirección y gobierno.',fns:['Definir prioridades funcionales de evolución de plataformas empresariales.','Aprobar mejoras o cambios mayores en ERP/CRM según impacto al negocio.','Dar seguimiento al uso y aprovechamiento de plataformas institucionales.','Asegurar que las plataformas apoyen los procesos estratégicos de la empresa.']},
    {area:5,obs:'Dirección y gobierno.',fns:['Impulsar una cultura de mejora continua basada en procesos.','Priorizar procesos críticos para rediseño o mejora.','Validar iniciativas de mejora con impacto transversal.','Dar seguimiento a resultados de eficiencia, tiempo y calidad en procesos mejorados.']},
    {area:6,obs:'Dirección y gobierno.',fns:['Aprobar políticas, normas y lineamientos de tecnología.','Asegurar cumplimiento de requisitos normativos y de auditoría.','Supervisar la gestión de riesgos tecnológicos del área.','Tomar decisiones sobre incidentes críticos de seguridad o cumplimiento.']},
    {area:7,obs:'Dirección y gobierno.',fns:['Promover una cultura de adopción tecnológica en toda la organización.','Impulsar programas de formación digital orientados a resultados.','Patrocinar buenas prácticas de colaboración entre tecnología y negocio.','Fomentar una cultura de innovación, servicio y mejora continua.']},

    {area:0,obs:'Operación TI.',fns:['Traducir la estrategia tecnológica en planes operativos de ejecución.','Coordinar recursos técnicos para cumplir prioridades del área.','Identificar necesidades de infraestructura derivadas de la estrategia.','Reportar desviaciones operativas que afecten el cumplimiento del plan tecnológico.']},
    {area:1,obs:'Operación TI.',fns:['Coordinar la implementación técnica de proyectos de digitalización.','Asegurar que la infraestructura soporte nuevas iniciativas digitales.','Gestionar dependencias técnicas entre áreas usuarias y TI.','Dar seguimiento a la ejecución operativa de proyectos transversales.']},
    {area:2,obs:'Operación TI.',fns:['Validar viabilidad técnica de automatizaciones e integraciones.','Asegurar disponibilidad de infraestructura para bots y herramientas inteligentes.','Coordinar accesos, ambientes y soporte técnico para automatizaciones.','Supervisar la operación estable de soluciones implementadas.']},
    {area:3,obs:'Operación TI.',fns:['Administrar servidores, redes, conectividad y almacenamiento.','Coordinar mantenimiento y actualización de infraestructura tecnológica.','Garantizar continuidad operativa de plataformas y servicios.','Evaluar capacidad tecnológica para soportar el crecimiento del negocio.','Supervisar respaldos, accesos y recuperación ante fallas.']},

    {area:5,obs:'Operación TI.',fns:['Participar en la mejora de procesos tecnológicos y de soporte interno.','Identificar cuellos de botella operativos del área de TI.','Coordinar la implementación de mejoras en procesos de atención o infraestructura.','Aportar criterios técnicos al rediseño de procesos digitales.']},

    {area:2,obs:'Soporte funcional ERP/CRM.',fns:['Identificar procesos del ERP/CRM que puedan automatizarse.','Validar reglas funcionales del ERP/CRM en automatizaciones.','Coordinar integraciones entre el ERP/CRM y bots RPA.','Asegurar que las automatizaciones no afecten la integridad funcional del sistema.']},
    {area:3,obs:'Soporte funcional ERP/CRM.',fns:['Coordinar requerimientos de infraestructura necesarios para el ERP/CRM.','Verificar disponibilidad del entorno donde opera el sistema.','Informar incidentes de plataforma que afecten el rendimiento del ERP/CRM.','Participar en pruebas de continuidad del ERP/CRM ante contingencias.']},
    {area:4,obs:'Soporte funcional ERP/CRM.',fns:['Coordinar soporte técnico de plataformas junto con infraestructura y accesos.','Atender requerimientos funcionales e incidencias del sistema.','Gestionar usuarios, permisos y catálogos de las plataformas.','Documentar flujos funcionales y capacitar usuarios clave.','Coordinar con proveedores temas operativos de funcionamiento.']},
    {area:5,obs:'Soporte funcional ERP/CRM.',fns:['Identificar oportunidades de mejora de proceso a través del uso del ERP/CRM.','Ajustar parametrizaciones que soporten procesos más eficientes.','Participar en rediseños funcionales de flujos operativos.','Medir incidencias recurrentes para detectar oportunidades de mejora.']},
    {area:6,obs:'Soporte funcional ERP/CRM.',fns:['Administrar perfiles, roles y permisos del ERP/CRM conforme a políticas internas.','Asegurar trazabilidad de cambios y accesos dentro del sistema.','Participar en auditorías funcionales y tecnológicas del ERP/CRM.','Controlar configuraciones sensibles que impacten seguridad de la información.']},
    {area:7,obs:'Soporte funcional ERP/CRM.',fns:['Capacitar usuarios clave en uso correcto del ERP/CRM.','Colaborar en la creación de materiales o guías funcionales de apoyo.','Resolver dudas de operación del sistema con enfoque al usuario.','Acompañar procesos de adopción de nuevas funcionalidades del ERP/CRM.']},

    {area:2,obs:'Levantamiento y rediseño.',fns:['Detectar procesos repetitivos y estandarizados candidatos a automatización.','Documentar reglas de negocio necesarias para desarrollar automatizaciones.','Validar que el proceso esté optimizado antes de automatizarse.','Medir eficiencia lograda después del levantamiento de un proceso.']},
    {area:3,obs:'Levantamiento y rediseño.',fns:['Documentar procesos críticos afectados por interrupciones tecnológicas.','Identificar impactos operativos ante caídas de servicios de TI.','Proponer ajustes de proceso para reducir dependencia operativa.','Apoyar la documentación de continuidad desde la perspectiva de negocio.']},
    {area:4,obs:'Levantamiento y rediseño.',fns:['Alinear procesos documentados con el funcionamiento real del ERP.','Detectar desviaciones entre el proceso esperado y el ejecutado en plataforma.','Apoyar definición funcional de mejoras del sistema desde la óptica de proceso.','Documentar procedimientos operativos vinculados al ERP/CRM.']},
    {area:5,obs:'Levantamiento y rediseño.',fns:['Construir y actualizar indicadores de desempeño de procesos para monitoreo periódico.','Analizar cuellos de botella, reprocesos y actividades sin valor agregado.','Diseñar procesos mejorados y estandarizados.','Dar seguimiento a implementación y control de mejoras.','Impulsar una cultura de mejora continua basada en procesos.']},
    {area:6,obs:'Levantamiento y rediseño.',fns:['Documentar controles de proceso requeridos para revisión y cumplimiento.','Alinear procedimientos con normas y políticas institucionales.','Identificar riesgos operativos derivados de procesos mal definidos.','Apoyar revisión con evidencia documental y trazabilidad de procesos.']},
    {area:7,obs:'Levantamiento y rediseño.',fns:['Socializar cambios de proceso con las áreas involucradas.','Capacitar sobre nuevos flujos, roles y procedimientos documentados.','Facilitar entendimiento de mejoras implementadas en los procesos.','Recabar retroalimentación de usuarios para ajustar procedimientos.']},
  ]},

    {area:0,obs:'Levantamiento y rediseño.',fns:['Identificar procesos críticos que deben alinearse con la estrategia digital.','Traducir objetivos del negocio en necesidades de rediseño de procesos.','Documentar brechas entre procesos actuales y procesos requeridos por la estrategia.','Apoyar la comunicación de cambios estratégicos hacia las áreas operativas.']},
    {area:1,obs:'Indicadores y control.',fns:['Validar que la documentación de procesos incluya flujos, etapas, responsables, controles y automatización futura.','Coordinar pruebas operativas de procesos digitalizados en conjunto con usuarios clave.','Ajustar procedimientos después de la implantación de herramientas digitales.','Recoger retroalimentación de áreas para estabilizar procesos transformados.']},
    {area:2,obs:'Indicadores y control.',fns:['Analizar causas de error o excepción en procesos automatizados para rediseñarlos.','Preparar insumos documentales y casos de uso para desarrollos RPA/IA.','Alinear controles del proceso con la lógica del bot o modelo inteligente.','Dar seguimiento post-implementación al desempeño operativo de automatizaciones.']},
    {area:3,obs:'Indicadores y control.',fns:['Definir rutas alternas manuales para mantener procesos clave durante contingencias.','Coordinar con áreas usuarias la validación de planes de continuidad operativa.','Validar evidencias de pruebas o simulacros de continuidad asociados a procesos.']},
    {area:4,obs:'Indicadores y control.',fns:['Validar con usuarios que los flujos del sistema reflejen correctamente el proceso aprobado.','Preparar especificaciones funcionales de ajustes menores en formularios, catálogos o reportes (SDD).','Analizar incidencias repetitivas del sistema originadas por fallas de proceso.','Apoyar pruebas funcionales posteriores a cambios o actualizaciones del ERP.']},
    {area:5,obs:'Indicadores y control.',fns:['Levantar, mapear y documentar procesos actuales.','Coordinar sesiones de validación con usuarios para aprobar mejoras propuestas.','Apoyar en revisiones de calidad mediante trazabilidad documental.','Promover metodologías de mejora continua en proyectos de rediseño operativo.','Impulsar una cultura de mejora continua basada en procesos.']},
    {area:6,obs:'Indicadores y control.',fns:['Actualizar matrices de control interno vinculadas a los procesos del negocio.','Verificar que los procedimientos incluyan segregación de funciones y puntos de control.','Preparar evidencias de cumplimiento para monitoreo interno.','Coordinar acciones correctivas derivadas de hallazgos relacionados con procesos.']},
    {area:7,obs:'Indicadores y control.',fns:['Diseñar materiales de apoyo para reforzar la adopción de procedimientos estandarizados.','Acompañar sesiones de capacitación relacionadas con cambios de proceso o control.','Identificar resistencias al cambio y proponer acciones de acompañamiento.','Dar seguimiento a observaciones de usuarios después de la capacitación.']},
  ]},
  {id:'tecnico',name:'Técnico de Infraestructura y Experiencia al Usuario',role:'Soporte a Usuarios',accent:'#9b59d0',photo:null,functions:[
    {area:0,obs:'Soporte a usuarios.',fns:['Ejecutar actividades operativas que soporten la estrategia tecnológica aprobada.','Detectar necesidades recurrentes de equipos y software en usuarios.','Informar obsolescencia tecnológica que impacte los objetivos del área.','Apoyar la implementación de renovaciones tecnológicas definidas estratégicamente.']},
    {area:1,obs:'Soporte a usuarios.',fns:['Preparar equipos y entornos para nuevas herramientas digitales.','Apoyar la adopción de soluciones tecnológicas en usuarios internos.','Resolver incidencias operativas durante implementaciones digitales.','Asegurar disponibilidad de estaciones de trabajo para proyectos de cambio tecnológico.']},
    {area:2,obs:'Soporte a usuarios.',fns:['Preparar equipos y entornos locales requeridos para automatizaciones.','Brindar soporte básico a usuarios que interactúan con bots o herramientas inteligentes.','Reportar fallas técnicas que afecten la ejecución de automatizaciones.','Apoyar instalación de componentes requeridos por soluciones RPA/IA.']},
    {area:3,obs:'Soporte a usuarios.',fns:['Ejecutar mantenimiento preventivo y correctivo de equipos.','Instalar, configurar y reemplazar hardware y software base.','Atender fallas de conectividad, periféricos y estaciones de trabajo.','Registrar incidencias técnicas y escalar problemas recurrentes o críticos.']},
    {area:4,obs:'Soporte a usuarios.',fns:['Instalación del acceso y plataformas de la Organización.','Verificar que equipos cliente tengan configuraciones necesarias para operar el ERP/CRM.','Resolver incidencias de estación de trabajo que afecten el acceso al sistema.','Escalar incidencias funcionales al Administrador ERP/CRM cuando corresponda.']},
    {area:5,obs:'Soporte a usuarios.',fns:['Proponer mejoras en el proceso de atención de tickets e incidencias.','Estandarizar rutinas de mantenimiento preventivo y correctivo.','Documentar fallas recurrentes para facilitar su reducción.','Aplicar buenas prácticas operativas que mejoren tiempos de atención.']},
    {area:6,obs:'Soporte a usuarios.',fns:['Aplicar configuraciones seguras en equipos de usuario final.','Controlar instalación autorizada de software y resguardo físico de equipos.','Verificar cumplimiento de políticas de uso de estaciones de trabajo.','Reportar incidentes de seguridad detectados en equipos o accesos.']},
    {area:7,obs:'Soporte a usuarios.',fns:['Brindar soporte técnico directo a usuarios internos.','Orientar a usuarios en configuraciones básicas y uso de herramientas.','Preparar equipos y estaciones para facilitar la adopción tecnológica.','Registrar necesidades recurrentes de soporte para fortalecer capacitación futura.']},

function initials(n){return n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()}

function buildPanel(person){
  const grid=person.functions.map(f=>{
    return`<div class="area-block" style="--acolor:${ACOLORS[f.area]}">
      <div class="area-label">${AREAS[f.area]}</div>
      <ul class="fn-list">${f.fns.map(fn=>`<li>${fn}</li>`).join('')}</ul>
      <div class="obs-tag">📌 ${f.obs}</div>
    </div>`;
  }).join('');
  return`<div class="fn-panel-title"><em>${person.name}</em> · Funciones por Área</div>
    <div class="area-grid">${grid}</div>`;
}

function buildCard(person){
  const photo=person.photo?`<img src="${person.photo}" alt="${person.name}"/>`:`<span>${initials(person.name)}</span>`;
  return`<div class="p-card" style="--accent:${person.accent}" id="card-${person.id}" onclick="toggleCard('${person.id}')">
    <div class="avatar">${photo}</div>
    <div class="p-name">${person.name}</div>
    <div class="p-role">${person.role}</div>
    <div class="p-chip">${person.role}</div>
    <div class="toggle-hint">Ver funciones
      <svg viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>`;
}

function render(){
  const tree=document.getElementById('orgTree');
  const leader=PEOPLE[0], team=PEOPLE.slice(1);

  // Director (above leader)
  const dw=document.createElement('div');
  dw.className='level-leader';
  dw.innerHTML=`<div class="p-card" style="--accent:${DIRECTOR.accent};max-width:300px;padding:22px 22px 18px;cursor:default;">
    <div class="avatar" style="width:68px;height:68px;font-size:21px;border-color:${DIRECTOR.accent}">
      <img src="${DIRECTOR.photo}" alt="${DIRECTOR.name}"/>
    </div>
    <div class="p-name" style="font-size:13px">${DIRECTOR.name}</div>
    <div class="p-role">${DIRECTOR.role}</div>
    <div class="p-chip" style="background:${DIRECTOR.accent}">${DIRECTOR.role}</div>
  </div>`;
  tree.appendChild(dw);

  // Trunk director → leader
  const dt=document.createElement('div');
  dt.className='trunk';
  dt.style.background='linear-gradient(to bottom,#e84393,#e07b00)';
  tree.appendChild(dt);

  // Leader
  const lw=document.createElement('div');
  lw.className='level-leader';
  lw.innerHTML=buildCard(leader);
  tree.appendChild(lw);

  // Trunk + leader panel
  const lb=document.createElement('div');
  lb.style.cssText='width:100%;display:flex;flex-direction:column;align-items:center;';
  lb.innerHTML=`<div class="trunk"></div>`;
  const lp=document.createElement('div');
  lp.className='fn-panel';lp.id='panel-lider';
  lp.innerHTML=`<div style="display:flex;justify-content:center;width:100%"><div class="fn-panel-inner" style="--p-accent:#e07b00">${buildPanel(leader)}</div></div>`;
  lb.appendChild(lp);
  const t2=document.createElement('div');t2.className='trunk';t2.id='trunk2';
  lb.appendChild(t2);
  tree.appendChild(lb);

  // Branches — técnico va como sub-reporte de coord
  const mainTeam=team.filter(p=>p.id!=='tecnico');
  const tecnico=team.find(p=>p.id==='tecnico');
  const brow=document.createElement('div');brow.className='branches';
  mainTeam.forEach(p=>{
    const b=document.createElement('div');b.className='branch';
    if(p.id==='coord'&&tecnico){
      const subCard=buildCard(tecnico).replace('<div class="p-card"','<div class="p-card sub-card"');
      b.innerHTML=`<div class="vline"></div>${buildCard(p)}<div class="sub-vline" style="background:${tecnico.accent}"></div>${subCard}`;
    } else {
      b.innerHTML=`<div class="vline"></div>${buildCard(p)}`;
    }
    brow.appendChild(b);
  });
  tree.appendChild(brow);

  // Panel rows (todos, incluyendo técnico)
  const pc=document.createElement('div');pc.id='branchPanels';
  team.forEach(p=>{
    const pr=document.createElement('div');
    pr.className='panel-row';pr.id=`panelrow-${p.id}`;
    pr.innerHTML=`<div class="fn-panel-inner" style="--p-accent:${p.accent}">${buildPanel(p)}</div>`;
    pc.appendChild(pr);
  });
  tree.appendChild(pc);
}

function toggleCard(id){
  const card=document.getElementById(`card-${id}`);
  if(id==='lider'){
    const p=document.getElementById('panel-lider'),t2=document.getElementById('trunk2');
    const open=card.classList.contains('open');
    card.classList.toggle('open');
    p.classList.toggle('open');
    t2.style.opacity=open?'1':'0.3';
    return;
  }
  const pr=document.getElementById(`panelrow-${id}`);
  const isOpen=card.classList.contains('open');
  document.querySelectorAll('.branches .p-card').forEach(c=>c.classList.remove('open'));
  document.querySelectorAll('.panel-row').forEach(p=>p.classList.remove('active'));
  if(!isOpen){
    card.classList.add('open');
    pr.classList.add('active');
    setTimeout(()=>pr.scrollIntoView({behavior:'smooth',block:'nearest'}),80);
  }
}

    icon:`<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>`
  }
];

(function renderResp(){
  const el = document.getElementById('fnIntro');
  el.innerHTML = `
    <p class="resp-intro-text">El Área de Tecnología articula su trabajo en torno a <strong>8 ejes de responsabilidad</strong> que cubren desde la estrategia y el gobierno digital hasta la formación y la cultura tecnológica en la organización.</p>
    <div class="resp-bento">
      ${RESP_AREAS.map(a=>`
        <div class="resp-card${a.wide?' wide':''}${a.tall?' tall':''}" style="--rc:${a.color}">
          <span class="resp-num">${a.num}</span>
          <div class="resp-icon">
            <svg viewBox="0 0 24 24"><g>${a.icon}</g></svg>
          </div>
          <div class="resp-area-num">Área ${a.num}</div>
          <div class="resp-title">${a.title}</div>
          <div class="resp-desc">${a.desc}</div>
          <div class="resp-tags">${a.tags.map(t=>`<span class="resp-tag">${t}</span>`).join('')}</div>
        </div>`).join('')}
    </div>`;
})();

render();

if('IntersectionObserver' in window){
  const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');obs.unobserve(e.target);}});},{threshold:0.1});
  document.querySelectorAll('.fi').forEach(el=>obs.observe(el));
}else{document.querySelectorAll('.fi').forEach(el=>el.classList.add('on'));}

window.addEventListener('scroll',()=>{
  document.getElementById('scprog').style.width=(window.scrollY/(document.body.scrollHeight-window.innerHeight)*100)+'%';
});
</script>
</body>
